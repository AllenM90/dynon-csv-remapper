[project]
name = "dynon-csv-remapper"
version = "0.1.0"
description = "Python frontend for the Dynon CSV remapping tool (Dynon2Savvy)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Allen" }]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
dynon2savvy = "dynon_csv_remapper.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynon_csv_remapper"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
